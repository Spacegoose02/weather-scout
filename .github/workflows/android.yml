name: Android app
# Builds the Weather Scout Android app: one APK that works with any Weather Scout
# server (it asks for the address the first time it opens). Run it from the
# Actions tab ("Run workflow"), or publish a release and the signed APK is
# attached to it. Signing setup: docs/APPS.md.
#
# Signing secrets (Settings > Secrets and variables > Actions > Secrets):
#   ANDROID_KEYSTORE_BASE64    the .jks file, base64-encoded
#   ANDROID_KEYSTORE_PASSWORD  its password
#   ANDROID_KEY_ALIAS          the key's alias (scripts/android-keystore.sh uses weather-scout)
#   ANDROID_KEY_PASSWORD       optional, only if the key has its own password
# Without them the workflow still builds a debug-signed APK to try out, but does
# not attach it to releases (each debug build has a different key, so it would
# not install over the last one).
on:
  workflow_dispatch:
  release:
    types: [published]
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']

permissions:
  contents: write   # attach the APK to a release

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Settings
        id: cfg
        env:
          APP_NAME: ${{ vars.ANDROID_APP_NAME }}
          PACKAGE: ${{ vars.ANDROID_PACKAGE_NAME }}
          TAG: ${{ github.event.release.tag_name }}
          HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
          HAS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
          HAS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS != '' }}
        run: |
          signed=false
          if [ "$HAS_KEY" = true ] && [ "${{ github.event_name }}" != pull_request ]; then
            if [ "$HAS_PASSWORD" != true ] || [ "$HAS_ALIAS" != true ]; then
              echo "::error::ANDROID_KEYSTORE_BASE64 is set, but ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS are needed too (docs/APPS.md)."
              exit 1
            fi
            signed=true
          fi
          if [ "$signed" != true ] && [ "${{ github.event_name }}" = release ]; then
            msg="No Android signing secrets yet, so this release gets no APK. A debug-signed APK to try is under this run's Artifacts. Add the ANDROID_KEYSTORE_* secrets (docs/APPS.md) for signed release APKs."
            echo "::notice::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          fi
          version="${TAG#v}"
          [ -n "$version" ] || version="$(node -p 'require("./package.json").version')"
          {
            echo "version=$version"
            echo "app_name=${APP_NAME:-Weather Scout}"
            echo "package=${PACKAGE:-app.weatherscout.android}"
            echo "signed=$signed"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key
        if: steps.cfg.outputs.signed == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          ks="$RUNNER_TEMP/weather-scout.jks"
          if ! printf '%s' "$KEYSTORE_B64" | tr -d '\r\n ' | base64 -d > "$ks" 2>/dev/null || [ ! -s "$ks" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 isn't valid base64. Make it with: base64 -w0 weather-scout.jks (macOS: base64 -i weather-scout.jks)"
            exit 1
          fi
          if ! keytool -list -keystore "$ks" -storepass "$STORE_PASS" -alias "$ALIAS" >/dev/null 2>&1; then
            echo "::error::Couldn't open the keystore with ANDROID_KEYSTORE_PASSWORD, or it has no key named ANDROID_KEY_ALIAS ($ALIAS). Check both secrets."
            exit 1
          fi
          echo "WS_KEYSTORE_FILE=$ks" >> "$GITHUB_ENV"

      - name: Build
        working-directory: android
        env:
          WS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          WS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          WS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APP_NAME: ${{ steps.cfg.outputs.app_name }}
          PACKAGE: ${{ steps.cfg.outputs.package }}
          VERSION: ${{ steps.cfg.outputs.version }}
          SIGNED: ${{ steps.cfg.outputs.signed }}
        run: |
          task=assembleRelease
          name="weather-scout-$VERSION.apk"
          if [ "$SIGNED" != true ]; then task=assembleDebug; name="weather-scout-$VERSION-debug.apk"; fi
          ./gradlew --no-daemon "$task" \
            -PwsAppName="$APP_NAME" -PwsPackageName="$PACKAGE" \
            -PwsVersionName="$VERSION" -PwsVersionCode="${{ github.run_number }}"
          apk=$(ls app/build/outputs/apk/*/*.apk | head -1)
          mkdir -p ../dist && cp "$apk" "../dist/$name"
          echo "APK=dist/$name" >> "$GITHUB_ENV"

      - name: Summary
        run: |
          fp=$(keytool -printcert -jarfile "$APK" | awk '/SHA256:/ {print $2; exit}')
          {
            echo "### Weather Scout for Android"
            echo "- Works with any Weather Scout server: the app asks for the address the first time it opens."
            echo "- Package: ${{ steps.cfg.outputs.package }}"
            echo "- Signing fingerprint: \`$fp\`"
            if [ "${{ steps.cfg.outputs.signed }}" = true ]; then
              echo ""
              echo "So the app opens full screen on every server, put this fingerprint in \`certSha256\` in \`shared/android-app.js\` (once; it stays the same for every build with this key). A server can also add it as \`ANDROID_CERT_SHA256\`."
            else
              echo ""
              echo "> This APK is signed with a throwaway debug key, so the next build will not install over it."
              echo "> Add the ANDROID_KEYSTORE_* secrets (docs/APPS.md) for a real release build."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: weather-scout-android
          path: ${{ env.APK }}

      - name: Attach to release
        if: github.event_name == 'release' && steps.cfg.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "$APK" --clobber
