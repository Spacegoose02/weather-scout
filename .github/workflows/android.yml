name: Android app
# Builds the Weather Scout Android app (a Trusted Web Activity that opens your
# server). Run it from the Actions tab ("Run workflow"), or publish a release and
# the APK is attached to it. Setup: docs/APPS.md.
on:
  workflow_dispatch:
    inputs:
      server_url:
        description: 'Your Weather Scout https address (blank = the WEATHER_SCOUT_URL repository variable)'
        required: false
  release:
    types: [published]
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']

permissions:
  contents: write   # attach the APK to a release

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Settings
        id: cfg
        env:
          INPUT_URL: ${{ inputs.server_url }}
          VAR_URL: ${{ vars.WEATHER_SCOUT_URL }}
          APP_NAME: ${{ vars.ANDROID_APP_NAME }}
          PACKAGE: ${{ vars.ANDROID_PACKAGE_NAME }}
          TAG: ${{ github.event.release.tag_name }}
          HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          url="${INPUT_URL:-$VAR_URL}"
          if [ -z "$url" ]; then
            if [ "${{ github.event_name }}" = pull_request ]; then
              url=https://weather-scout.example.com   # just checks that it builds
            else
              echo "::error::Set the WEATHER_SCOUT_URL repository variable (Settings > Secrets and variables > Actions > Variables) or type an address when running the workflow."
              exit 1
            fi
          fi
          case "$url" in https://*) ;; *) echo "::error::The address must start with https:// (got $url)"; exit 1 ;; esac
          version="${TAG#v}"
          [ -n "$version" ] || version="$(node -p 'require("./package.json").version')"
          {
            echo "url=$url"
            echo "version=$version"
            echo "app_name=${APP_NAME:-Weather Scout}"
            echo "package=${PACKAGE:-app.weatherscout.android}"
            echo "signed=$HAS_KEY"
          } >> "$GITHUB_OUTPUT"

      - name: Signing key
        if: steps.cfg.outputs.signed == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/weather-scout.jks"

      - name: Build
        working-directory: android
        env:
          WS_KEYSTORE_FILE: ${{ steps.cfg.outputs.signed == 'true' && format('{0}/weather-scout.jks', runner.temp) || '' }}
          WS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          WS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          WS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          URL: ${{ steps.cfg.outputs.url }}
          APP_NAME: ${{ steps.cfg.outputs.app_name }}
          PACKAGE: ${{ steps.cfg.outputs.package }}
          VERSION: ${{ steps.cfg.outputs.version }}
          SIGNED: ${{ steps.cfg.outputs.signed }}
        run: |
          task=assembleRelease
          name="weather-scout-$VERSION.apk"
          if [ "$SIGNED" != true ]; then task=assembleDebug; name="weather-scout-$VERSION-debug.apk"; fi
          ./gradlew --no-daemon "$task" \
            -PwsUrl="$URL" -PwsAppName="$APP_NAME" -PwsPackageName="$PACKAGE" \
            -PwsVersionName="$VERSION" -PwsVersionCode="${{ github.run_number }}"
          apk=$(ls app/build/outputs/apk/*/*.apk | head -1)
          mkdir -p ../dist && cp "$apk" "../dist/$name"
          echo "APK=dist/$name" >> "$GITHUB_ENV"

      - name: Summary
        run: |
          fp=$(keytool -printcert -jarfile "$APK" | awk '/SHA256:/ {print $2; exit}')
          {
            echo "### Weather Scout for Android"
            echo "- Server: ${{ steps.cfg.outputs.url }}"
            echo "- Package: ${{ steps.cfg.outputs.package }}"
            echo "- Signing fingerprint (put this in \`ANDROID_CERT_SHA256\` on the server): \`$fp\`"
            if [ "${{ steps.cfg.outputs.signed }}" != true ]; then
              echo ""
              echo "> This APK is signed with a throwaway debug key, so the next build will not install over it."
              echo "> Add the ANDROID_KEYSTORE_* secrets (docs/APPS.md) for a real release build."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: weather-scout-android
          path: ${{ env.APK }}

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "$APK" --clobber
